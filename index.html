<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneSpot — Your personal data hub</title>
  <meta name="description" content="OneSpot — Save links, notes, images and checklists. All stored in your own Dropbox. Your data, your drive.">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://xdmc.fun">
  <meta property="og:title" content="OneSpot — Your personal data hub">
  <meta property="og:description" content="Save links, notes, images and checklists — all stored in your own Dropbox.">
  <meta property="og:image" content="https://xdmc.fun/icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="OneSpot">
  <meta name="twitter:description" content="Save links, notes, images and checklists in your own Dropbox.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f7f6f2" id="meta-theme-color">
  
  <script>
    if (localStorage.getItem('onespot_theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('meta-theme-color').setAttribute('content', '#121212');
    }
  </script>

  <link rel="preconnect" href="https://dl.dropboxusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://dl.dropboxusercontent.com">
  
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
  <div class="app-container">
    
    <main class="feed-container" id="view-home">
      <div id="pull-indicator" style="display:none;">
        <div class="pull-arrow material-symbols-outlined">arrow_downward</div>
        <span>Pull to refresh</span>
      </div>
      
      <div id="search-header" style="padding: 0 4px; background: transparent;">
        <div class="search-content" style="background: transparent;">
          
          <div class="search-wrapper">
            <span class="material-symbols-outlined search-icon">search</span>
            <input type="text" id="feed-search-input" placeholder="Search posts by title or link..." class="font-body-md search-input" />
            <button id="btn-refresh-feed" class="btn-inset" title="Refresh feed">
              <span class="material-symbols-outlined icon-sm">refresh</span>
            </button>
          </div>

          <div class="hide-scroll tags-scroll">
            
            <div class="tag-filter-wrap">
              <span class="material-symbols-outlined tag-filter-icon">filter_alt</span>
              <input type="text" id="tag-search-input" placeholder="Find tags..." class="font-label-sm tag-filter-input" />
            </div>

            <div id="search-tags-container" style="display: flex; gap: 8px; flex-wrap: nowrap; background: transparent;">
            </div>

          </div>
        </div>
      </div>

      <div class="masonry-grid" id="feed-grid"></div>
    </main>

    <!-- Profile View -->
    <main class="container view-container" id="view-profile" style="text-align: center;">
      <div class="card-section shadow-ambient">
        <img id="profile-image" src="" alt="Profile" class="profile-avatar profile-avatar--img" />
        <div id="profile-placeholder" class="profile-avatar profile-avatar--placeholder">
          <span class="material-symbols-outlined icon-lg">person</span>
        </div>
        <div>
          <h1 id="profile-name" class="font-display" style="font-size: 24px;">Loading...</h1>
          <p id="profile-email" class="font-body-md" style="color: var(--on-surface-variant); margin-top: 4px;"></p>
        </div>

        <div class="divider divider--top"></div>
        
        <div class="profile-row">
          <div class="profile-row__left">
             <span class="material-symbols-outlined">dark_mode</span>
             <span class="font-body-md">Dark Mode</span>
          </div>
          <button id="btn-theme-toggle" class="toggle-switch">
            <div id="theme-toggle-knob" class="toggle-knob"></div>
          </button>
        </div>

        <div class="divider"></div>
        
        <a href="privacy.html" class="profile-row" style="text-decoration: none; cursor: pointer; transition: opacity 0.2s;">
          <div class="profile-row__left">
             <span class="material-symbols-outlined">policy</span>
             <span class="font-body-md">Privacy Policy</span>
          </div>
          <span class="material-symbols-outlined" style="color: var(--on-surface-variant);">chevron_right</span>
        </a>

        <div class="divider divider--bottom"></div>

        <button id="btn-logout" class="font-label-sm shadow-ambient btn-danger" style="padding: 12px 24px; margin-top: 8px;">Disconnect
          Dropbox</button>
      </div>
    </main>

    <!-- Add View -->
    <main class="container view-container--add" id="view-add">
      
      <!-- Locked preview container to 500px centered -->
      <div class="preview-container" id="add-preview-container"></div>

      <div style="display: flex; justify-content: flex-start; margin-bottom: 12px; padding: 0 4px;">
        <button id="btn-toggle-list" type="button" class="font-label-sm btn-outline" style="display: flex; align-items: center; gap: 6px; padding: 8px 16px;">
          <span class="material-symbols-outlined" style="font-size: 18px;">format_list_bulleted</span> List
        </button>
      </div>

      <!-- Main Textbox Division -->
      <div class="form-section shadow-ambient">
        
        <div class="form-group">
          <div class="form-field">
            <textarea id="add-title" placeholder="Post Title (max 100 chars)" maxlength="100" class="font-body-md auto-expand form-textarea form-textarea--with-counter" rows="1"></textarea>
            <span id="title-counter" class="font-label-sm title-counter">0/100</span>
          </div>
            
          <textarea id="add-description" placeholder="Description (optional)..." class="font-body-md auto-expand form-textarea" style="min-height: 100px;"></textarea>
            
          <!-- Dynamic Checklist Builder Container -->
          <div id="add-list-container" style="display: none; flex-direction: column; gap: 12px; width: 100%;">
          </div>
        </div>

        <!-- Link Input Group -->
        <div class="form-group">
          <div class="form-field">
            <textarea id="add-link" placeholder="Paste a link..." class="font-body-md auto-expand form-textarea form-textarea--with-btn form-textarea--break" rows="1"></textarea>
            
            <button id="btn-show-anchor" type="button" class="font-label-sm btn-inset" title="Add Anchor Text">
              <span class="material-symbols-outlined icon-sm">text_fields</span>
            </button>
          </div>
          
          <div id="anchor-container" style="display: none; width: 100%;">
            <div class="form-field">
              <textarea id="add-anchor" placeholder="Anchor text..." class="font-body-md auto-expand form-textarea form-textarea--with-btn form-textarea--break" rows="1"></textarea>
              <button id="btn-close-anchor" type="button" class="btn-inset" title="Remove Anchor Text">
                <span class="material-symbols-outlined icon-sm">close</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Image Upload Group -->
        <div class="form-field">
          <textarea id="add-image" placeholder="Image URL..." class="font-body-md auto-expand form-textarea form-textarea--with-btn form-textarea--break" rows="1"></textarea>
          <label title="Upload Image" class="btn-inset">
            <span class="material-symbols-outlined icon-sm">upload_file</span>
            <input type="file" id="add-image-file" accept="image/*" style="display: none;" />
          </label>
        </div>
      </div>

      <!-- Tags Section -->
      <div class="tags-section">
        <h2 class="font-label-sm" style="color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; margin-left: 4px;">Tags</h2>
        <div id="tags-container" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="btn-discard-entry" type="button" class="font-label-sm btn-outline" style="flex: 1; padding: 18px 16px;">Discard</button>
          
        <button id="btn-save-entry" type="button" class="font-label-sm shadow-ambient btn-primary" style="flex: 2; padding: 18px 16px;">Save Post</button>
      </div>
    </main>

    <div id="selection-bar" class="selection-bar">
      <div class="shadow-nav selection-bar__inner">
        <span class="font-label-md" style="color: var(--on-surface); margin-left: 8px;" id="selection-count">0 Selected</span>
        <div class="selection-bar__actions">
          <button id="btn-edit" class="font-label-sm btn-edit-sm">Edit</button>
          <button id="btn-delete" class="font-label-sm btn-delete-sm">Delete</button>
          <div class="selection-bar__divider"></div>
          <button id="btn-close-selection" class="selection-bar__close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>
    </div>

    <div id="tag-selection-bar" class="selection-bar">
      <div class="shadow-nav selection-bar__inner">
        <span class="font-label-md" style="color: var(--on-surface); margin-left: 8px;" id="tag-selection-count">0 Selected</span>
        <div class="selection-bar__actions">
          <button id="btn-edit-tag" class="font-label-sm btn-edit-sm">Edit</button>
          <button id="btn-delete-tag" class="font-label-sm btn-delete-sm">Delete</button>
          <div class="selection-bar__divider"></div>
          <button id="btn-close-tag-selection" class="selection-bar__close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>
    </div>

    <div id="bottom-nav" class="nav-bar">
      <nav id="nav-container" class="nav-pill shadow-nav">
        
        <div id="nav-toast" class="font-label-sm nav-toast"></div>

        <div id="nav-indicator" class="nav-indicator">
        </div>
        <a href="#/" class="nav-link nav-link-item" data-index="0">
          <span class="material-symbols-outlined">home</span>
        </a>
        <a href="#/add" class="nav-link nav-link-item" data-index="1">
          <span class="material-symbols-outlined">add</span>
        </a>
        <a href="#/profile" class="nav-link nav-link-item" data-index="2">
          <span class="material-symbols-outlined">person</span>
        </a>
      </nav>
    </div>

    <div id="detail-backdrop" class="detail-backdrop">
    </div>
    
    <div id="detail-sheet" class="detail-panel">
      <div class="detail-panel__header">
        <button id="btn-sheet-edit" class="font-label-sm detail-panel__edit">
          <span class="material-symbols-outlined icon-md">edit</span> Edit
        </button>
        <button id="btn-sheet-close" class="detail-panel__close">
          <span class="material-symbols-outlined icon-sm">close</span>
        </button>
      </div>
      <div id="detail-content" style="padding: 0 20px calc(48px + env(safe-area-inset-bottom)); overflow: hidden;">
      </div>
    </div>

    <div id="tag-edit-backdrop" class="modal-backdrop">
      <div id="tag-edit-modal" class="shadow-ambient modal-panel">
        <h2 class="font-headline-md" style="margin-bottom: 16px; color: var(--on-surface); font-size: 20px;">Edit Tag</h2>
        <input type="text" id="tag-edit-input" class="font-body-md form-textarea" style="margin-bottom: 24px; padding: 12px 16px; overflow: visible; resize: none;" />
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button id="btn-tag-edit-cancel" class="font-label-sm btn-ghost" style="padding: 10px 16px;">Cancel</button>
          <button id="btn-tag-edit-save" class="font-label-sm shadow-ambient btn-primary" style="padding: 10px 24px;">Save</button>
        </div>
      </div>
    </div>


  </div>



  <script src="dropbox-sdk.min.js" defer></script>
  <script src="app.js?v=7" type="module"></script>
</body>

</html>
